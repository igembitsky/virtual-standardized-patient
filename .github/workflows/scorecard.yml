# OpenSSF Scorecard checks the project's security practices: pinned dependencies, workflow
# permissions, branch protection, code review, and more. It publishes a public score and badge.
# A high score is about practices; it does not certify that the program has no defects.
# Results: https://scorecard.dev/viewer/?uri=github.com/igembitsky/virtual-standardized-patient
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"        # every Monday
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write      # to upload the results to the Security tab
      id-token: write             # to publish the results and the badge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
