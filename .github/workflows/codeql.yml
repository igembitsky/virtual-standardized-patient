# CodeQL, GitHub's code scanner, looks for security defects such as injection and unsafe data
# handling. It covers the page (JavaScript in app/index.html), the Linux server and the
# benchmark tools (Python), and these workflows. It does not cover the Perl, PowerShell and
# shell launchers; the launcher tests in launchers.yml cover those. Results:
# https://github.com/igembitsky/virtual-standardized-patient/security/code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # every Monday, to catch newly known kinds of defects
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # to upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # The phone edition's copy of the page is built from app/index.html, which is scanned,
          # and lib/ is the WebLLM library as published. docs/phone/phone.js is scanned.
          config: |
            paths-ignore:
              - docs/phone/index.html
              - docs/phone/lib
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
