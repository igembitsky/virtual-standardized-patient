<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A Finder window with the Downloads folder open. An arrow shows the folder virtual-standardized-patient-main being dragged onto Applications in the sidebar.">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a64d8"/>
    </marker>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb7f6"/>
      <stop offset="1" stop-color="#3d95e9"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .side { font-size: 14px; fill: #1f2328; }
    .muted { font-size: 11px; fill: #8a8f96; font-weight: 600; }
    .label { font-size: 13px; fill: #1f2328; }
    .title { font-size: 14px; fill: #1f2328; font-weight: 600; }
    .note { font-size: 15px; fill: #0a64d8; font-weight: 600; }
  </style>

  <!-- window -->
  <rect x="20" y="20" width="720" height="360" rx="14" fill="#ffffff" stroke="#d0d4d9" filter="url(#shadow)"/>
  <!-- sidebar -->
  <path d="M20 34 a14 14 0 0 1 14 -14 H220 V380 H34 a14 14 0 0 1 -14 -14 z" fill="#eef0f3"/>
  <circle cx="44" cy="44" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="44" r="6" fill="#febc2e"/>
  <circle cx="84" cy="44" r="6" fill="#28c840"/>

  <text x="40" y="92" class="muted">FAVORITES</text>
  <!-- Applications, the drop target -->
  <rect x="30" y="104" width="180" height="32" rx="7" fill="#dbe9fb" stroke="#0a64d8" stroke-width="2" stroke-dasharray="5 4"/>
  <g transform="translate(44 111)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#0a64d8"/>
    <path d="M5 13 L9 4 L13 13 M6.5 10 H11.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <text x="72" y="125" class="side" font-weight="600">Applications</text>
  <text x="44" y="164" class="side">Desktop</text>
  <text x="44" y="198" class="side">Documents</text>
  <!-- Downloads, the current folder -->
  <rect x="30" y="214" width="180" height="32" rx="7" fill="#d9dde3"/>
  <text x="44" y="235" class="side" font-weight="600">Downloads</text>

  <!-- toolbar title -->
  <text x="244" y="50" class="title">Downloads</text>
  <line x1="220" y1="72" x2="740" y2="72" stroke="#e6e8eb"/>

  <!-- the unzipped folder -->
  <g transform="translate(480 150)">
    <path d="M0 16 a6 6 0 0 1 6 -6 H30 l8 8 H74 a6 6 0 0 1 6 6 V62 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 z" fill="url(#folder)"/>
    <rect x="0" y="24" width="80" height="44" rx="6" fill="#8cc6f8" opacity="0.55"/>
  </g>
  <rect x="408" y="232" width="224" height="24" rx="6" fill="#0a64d8"/>
  <text x="520" y="249" class="label" fill="#ffffff" text-anchor="middle" style="fill:#fff">virtual-standardized-patient-main</text>

  <!-- the ZIP, for context -->
  <g transform="translate(300 160)" opacity="0.55">
    <rect x="0" y="0" width="44" height="56" rx="5" fill="#f3f4f6" stroke="#c9cdd2"/>
    <rect x="18" y="4" width="8" height="30" fill="#c9cdd2"/>
    <text x="22" y="50" font-size="10" fill="#6b7178" text-anchor="middle">ZIP</text>
  </g>
  <text x="322" y="240" class="label" text-anchor="middle" fill="#8a8f96" style="fill:#8a8f96">the ZIP file</text>

  <!-- the drag -->
  <path d="M470 176 C 380 110, 300 100, 216 120" fill="none" stroke="#0a64d8" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="340" y="104" class="note" text-anchor="middle">Drag the folder onto Applications</text>

  <!-- the step, in plain words -->
  <text x="480" y="320" class="label" text-anchor="middle" fill="#59636e" style="fill:#59636e">If Finder asks you to authenticate, type your Mac password.</text>
</svg>
