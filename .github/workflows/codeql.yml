# CodeQL, GitHub's code scanner, looks for security defects such as injection and unsafe data
# handling. It covers the page (JavaScript in app/index.html), the Linux server and the
# benchmark tools (Python), and these workflows. It does not cover the Perl, PowerShell and
# shell launchers; the launcher tests in launchers.yml cover those. Results:
# https://github.com/igembitsky/virtual-standardized-patient/security/code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # every Monday, to catch newly known kinds of defects
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # to upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
