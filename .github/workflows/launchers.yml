# Runs each launcher on a real Mac, Windows, and Linux machine, the way a participant would
# get it: from the "Download ZIP" archive, unpacked into a folder with a space in its name.
# tests/e2e.mjs drives the page in Chrome against a stand-in for Ollama. Then the Start file
# itself is run, and the simulator is stopped with Quit.
name: Launchers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            server: python3 app/server.py
          - os: macos-latest
            server: /usr/bin/perl app/server.pl
          - os: windows-latest
            server: powershell -NoProfile -ExecutionPolicy Bypass -File app/server.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PW_CHANNEL: chrome
      PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund --prefix tests playwright@1.56.1

      - name: Build the ZIP a participant downloads, and unpack it
        run: |
          git archive --format=zip --prefix=virtual-standardized-patient-main/ -o "$RUNNER_TEMP/latest.zip" HEAD
          mkdir -p "$RUNNER_TEMP/My Desktop"
          case "$RUNNER_OS" in
            macOS)   ditto -x -k "$RUNNER_TEMP/latest.zip" "$RUNNER_TEMP/My Desktop" ;;
            Windows) powershell -NoProfile -Command "Expand-Archive -LiteralPath \"$RUNNER_TEMP/latest.zip\" -DestinationPath \"$RUNNER_TEMP/My Desktop\"" ;;
            *)       unzip -q "$RUNNER_TEMP/latest.zip" -d "$RUNNER_TEMP/My Desktop" ;;
          esac
          echo "INST=$RUNNER_TEMP/My Desktop/virtual-standardized-patient-main" >> "$GITHUB_ENV"

      - name: The download holds only what a participant needs
        run: |
          got=$(ls -1 "$INST" | LC_ALL=C sort | tr '\n' '|')
          echo "$got"
          [ "$got" = "CHANGELOG.md|LICENSE|README.md|Start on Linux.desktop|Start on Mac.app|Start on Windows.bat|app|" ]

      - name: End-to-end test of the server
        env:
          ZIP_FILE: ${{ runner.temp }}/latest.zip
        run: node tests/e2e.mjs "$INST" ${{ matrix.server }}

      - name: Start on Mac.app, opened as Finder would
        if: runner.os == 'macOS'
        run: |
          ls -l "$INST/Start on Mac.app/Contents/MacOS/start"
          open --env VSP_NO_BROWSER=1 "$INST/Start on Mac.app"
          . tests/launched.sh

      - name: Start on Windows.bat, double-clicked
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VSP_NO_BROWSER = '1'
          Start-Process -FilePath (Join-Path $env:INST 'Start on Windows.bat')
          Start-Sleep 8
          Get-Process powershell -ErrorAction SilentlyContinue |
            Select-Object Id, MainWindowTitle, @{ n = 'window'; e = { $_.MainWindowHandle -ne 0 } } | Format-Table | Out-String | Write-Host
          bash tests/launched.sh

      - name: Start on Linux.desktop, as a desktop would run it
        if: runner.os == 'Linux'
        run: |
          desk="$INST/Start on Linux.desktop"
          line=$(sed -n 's/^Exec=sh -c '"'"'\(.*\)'"'"' %k$/\1/p' "$desk")
          VSP_NO_BROWSER=1 sh -c "$line" "$desk" &
          . tests/launched.sh

      - name: The launcher log
        if: always()
        run: |
          for d in "${TMPDIR:-}" "${TEMP:-}" /tmp; do
            [ -n "$d" ] && [ -f "$d/virtual-standardized-patient.log" ] && cat "$d/virtual-standardized-patient.log" && break
          done; true
